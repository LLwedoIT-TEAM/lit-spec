name: Specification or schema bug
description: Report an inconsistency, invalid schema behavior, or documentation defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve LIT. Do not disclose security vulnerabilities here; use private vulnerability reporting instead.

  - type: input
    id: location
    attributes:
      label: Affected file or section
      description: Identify the schema, example, or specification section.
      placeholder: schema/components.schema.json
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the observed behavior and why it is incorrect or inconsistent.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe JSON sample or sequence that demonstrates the problem.
      render: json
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the result you expected.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This report does not contain secrets, personal data, or undisclosed vulnerability details.
          required: true
